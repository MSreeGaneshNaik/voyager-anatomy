# Every half hour, reads NASA's Deep Space Network "DSN Now" feed and records in status.json (on the
# gh-pages branch the site is served from) when a DSN dish last heard Voyager 1 or Voyager 2.
# The page reads status.json and flags a probe the network hasn't heard for weeks.
name: DSN watch
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: dsn-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read the DSN feed
        run: node main/scripts/dsn-watch.mjs site/status.json
      - name: Commit if anything changed
        id: commit
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "status: Deep Space Network check $(date -u +%F' '%H:%M) UT"
          git push origin HEAD:gh-pages
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Republish the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages will pick it up on its next build"
